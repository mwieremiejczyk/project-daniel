<style>
  :root{--a:#ff3b3b;--b:#ffd23f;--bg:#07070c}
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{background:radial-gradient(ellipse at top,#1b1030 0%,var(--bg) 60%);color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;overflow-x:hidden;padding:24px 24px 84px;min-height:100%}
  canvas{position:fixed;inset:0;z-index:-1}
  .tag{letter-spacing:.5em;font-size:.8rem;color:var(--b);text-transform:uppercase;opacity:.85}
  h1{font-size:clamp(2.6rem,10vw,7rem);font-weight:900;line-height:.95;margin:.35em 0 .3em;letter-spacing:.04em;
    background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;
    text-shadow:0 0 60px rgba(255,59,59,.25)}
  @keyframes sh{to{background-position:200%}}
  .ph{font-size:clamp(1.1rem,4vw,2rem);font-weight:300;letter-spacing:.6em;margin-top:1.2rem;margin-right:-.6em;opacity:.9}
  .acr{font-size:clamp(.8rem,2.4vw,1.05rem);letter-spacing:.15em;text-transform:uppercase;opacity:.7;margin-bottom:.8rem}
  .acr b{color:var(--b);font-weight:900;transition:text-shadow .3s,color .3s}
  .acr b.hit{color:#fff;text-shadow:0 0 12px #ffd23f,0 0 24px #ff3b3b}
  h1{animation:sh 6s linear infinite,float 4s ease-in-out infinite,breathe 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
  @keyframes breathe{50%{filter:drop-shadow(0 0 22px rgba(255,59,59,.55)) drop-shadow(0 0 40px rgba(255,210,63,.25))}}
  .sub{font-size:clamp(1rem,3vw,1.4rem);opacity:.8;margin-bottom:2.2rem}
  .route{display:flex;align-items:center;gap:14px;justify-content:center;font-weight:800;
    font-size:clamp(1rem,3.5vw,1.6rem);margin-bottom:2.5rem;width:min(640px,100%)}
  .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,#fff6 0 8px,transparent 8px 16px);position:relative}
  .plane{position:absolute;top:-.6em;transform:translateX(-50%);transition:left 1s;line-height:0}
  .city{display:inline-flex;align-items:center;gap:.45em}
  .flag{width:1.6em;height:auto;border-radius:3px;box-shadow:0 0 0 1px #fff3}
  h1{position:relative}
  .done h1::before,.done h1::after,h1.gl::before,h1.gl::after{content:attr(data-t);position:absolute;inset:0;-webkit-text-fill-color:currentColor;
    background:none;text-shadow:none;pointer-events:none}
  h1.gl::before{color:#0ff;mix-blend-mode:screen;animation:g1 .25s infinite steps(2)}
  h1.gl::after{color:#f0f;mix-blend-mode:screen;animation:g2 .2s infinite steps(2)}
  .done h1::before{color:#0ff;mix-blend-mode:screen;animation:g1 .9s infinite steps(2)}
  .done h1::after{color:#f0f;mix-blend-mode:screen;animation:g2 .7s infinite steps(2)}
  @keyframes g1{0%{transform:translate(0);clip-path:inset(0 0 70% 0)}25%{transform:translate(-6px,2px);clip-path:inset(40% 0 30% 0)}
    50%{transform:translate(5px,-2px);clip-path:inset(75% 0 5% 0)}75%{transform:translate(-3px,1px);clip-path:inset(10% 0 60% 0)}100%{transform:translate(0);clip-path:inset(0 0 100% 0)}}
  @keyframes g2{0%{transform:translate(0);clip-path:inset(60% 0 10% 0)}33%{transform:translate(6px,-1px);clip-path:inset(20% 0 55% 0)}
    66%{transform:translate(-5px,2px);clip-path:inset(85% 0 0 0)}100%{transform:translate(0);clip-path:inset(0 0 100% 0)}}
  .win{font-size:clamp(1.6rem,7vw,4.5rem);font-weight:900;line-height:1.1;animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(1.06);text-shadow:0 0 40px #ffd23f88}}
  #snd{margin-top:1.5rem;padding:.8em 1.6em;font:800 1rem system-ui;letter-spacing:.15em;color:#07070c;background:var(--b);
    border:0;border-radius:999px;cursor:pointer;box-shadow:0 0 30px #ffd23f66}
  #mus{position:fixed;right:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:.6em;padding:.6em 1.1em;
    font:800 .8rem system-ui;letter-spacing:.2em;color:#fff;background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;
    cursor:pointer;backdrop-filter:blur(6px)}
  #mus.hint{animation:hint 1.2s ease-in-out infinite}
  @keyframes hint{50%{border-color:#ffd23f;box-shadow:0 0 18px #ffd23f88}}
  #mus:hover{background:#ffd23f;color:#07070c}
  #mus .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
  #mus .eq i{width:3px;height:3px;background:currentColor}
  #mus.on .eq i{animation:eq .5s ease-in-out infinite alternate}
  #mus.on .eq i:nth-child(2){animation-delay:.15s}#mus.on .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{to{height:12px}}
  #yt{position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:0;pointer-events:none}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  .cd{display:flex;gap:clamp(10px,3vw,28px);justify-content:center}
  .u{min-width:clamp(70px,18vw,140px);padding:18px 8px;border-radius:18px;background:#ffffff0d;
    border:1px solid #ffffff1f;backdrop-filter:blur(6px)}
  .n{font-size:clamp(2.2rem,9vw,5rem);font-weight:900;font-variant-numeric:tabular-nums}
  .l{font-size:.75rem;letter-spacing:.3em;opacity:.6;text-transform:uppercase}
  .status{margin-top:2rem;font-size:clamp(.7rem,2.2vw,.9rem);letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    color:var(--b);padding:.7em 1.3em;border:1px solid #ffd23f44;border-radius:999px;background:#ffd23f0d}
  .status a{color:#fff}
  .status.air{animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{border-color:#ffd23f;box-shadow:0 0 24px #ffd23f55}}
  .foot{margin-top:1.5rem;opacity:.5;font-size:.85rem}
  .done h1{animation:sh 1.2s linear infinite}
</style>

<body>
<canvas id="s"></canvas><canvas id="fx"></canvas>
<button id="mus" aria-label="Muzyka"><span class="eq"><i></i><i></i><i></i></span><span id="mt">SOUNDTRACK</span></button><div id="yt"></div>
<div class="tag">Top secret · ściśle tajne · clearance level: wódka</div>
<div class="ph">PROJECT HORIZON</div>
<h1 data-t="D.A.N.I.E.L">D.A.N.I.E.L</h1>
<div class="acr"><b>D</b>on't <b>A</b>sk, <b>N</b>ajebany <b>I</b>s <b>E</b>xpected <b>L</b>ater</div>
<div class="sub" id="sub">Polska, przygotuj się. Nadchodzi.</div>
<div class="route"><span class="city"><svg class="flag" viewBox="0 0 60 30" aria-label="UK"><clipPath id="t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>LONDON</span><div class="line"><span class="plane" id="pl"><svg viewBox="-40 -30 80 60" width="1.6em" height="1.2em"><path fill="#ffd23f" d="M36,0 26,-5H-22L-30,-14H-36L-30,-4V4L-36,14H-30L-22,5H26ZM8,-4-6,-28H-14L-6,-4ZM8,4-6,28H-14L-6,4Z"/></svg></span></div><span class="city">MODLIN<svg class="flag" viewBox="0 0 16 10" aria-label="PL"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg></span></div>
<div class="cd" id="cd">
  <div class="u"><div class="n" id="d">--</div><div class="l">dni</div></div>
  <div class="u"><div class="n" id="h">--</div><div class="l">hours</div></div>
  <div class="u"><div class="n" id="m">--</div><div class="l">minut</div></div>
  <div class="u"><div class="n" id="sec">--</div><div class="l">seconds</div></div>
</div>
<div class="status" id="st"></div>
<div class="foot">29.11.2026 · 17:25 · Stansted → Modlin · No more fish &amp; chips, czas na pierogi.</div>
<script>
// Cel: 29.11.2026 00:00 czasu warszawskiego. Godzinę lądowania zmień tutaj. Test finału: ?test=10 (sekund).
const q=+new URLSearchParams(location.search).get("test");
// FR1834: Stansted 29.11 14:10 (UK) = 15:10 PL → Modlin 17:25 PL. Powrót FR1835: 06.12 12:15 PL. Test finału: ?test=10 (sekund).
const T=q?Date.now()+q*1000:Date.parse("2026-11-29T17:25:00+01:00"),
  OFF=q?T-30000:Date.parse("2026-11-29T15:10:00+01:00"),DAY=q?T-60000:Date.parse("2026-11-29T00:00:00+01:00"),
  BACK=Date.parse("2026-12-06T12:15:00+01:00");
const $=id=>document.getElementById(id),p=n=>String(n).padStart(2,"0");
const FR='<a href="https://www.flightradar24.com/data/flights/fr1834" target="_blank" rel="noopener">FlightRadar ↗</a>';
let stLast="";
function status(now){
  const t=now<DAY?"⏳ STATUS: WAITING · FR1834 · STN 14:10 → WMI 17:25"
    :now<OFF?"🛂 STATUS: CHECK-IN · BOARDING SOON · FR1834 STN 14:10"
    :"✈️ STATUS: IN THE AIR · FR1834 → MODLIN 17:25 · "+FR;
  if(t!==stLast){$("st").innerHTML=t;$("st").classList.toggle("air",now>=OFF);stLast=t}
}
function tick(){
  const now=Date.now(),r=T-now;
  $("pl").style.left=Math.min(100,Math.max(0,(now-OFF)/(T-OFF)*100))+"%";
  if(r<=0){finale();return}
  status(now);
  $("d").textContent=Math.floor(r/864e5);$("h").textContent=p(Math.floor(r/36e5)%24);
  $("m").textContent=p(Math.floor(r/6e4)%60);$("sec").textContent=p(Math.floor(r/1e3)%60);
  setTimeout(tick,1000-Date.now()%1000);
}
function finale(){
  document.body.classList.add("done");document.title="🍻 DANIEL IS IN DA HOUSE";
  $("cd").innerHTML='<div><div class="win">🍻 DANIEL IS IN DA HOUSE 🍻</div><button id="snd">🔊 TOUCHDOWN</button></div>';
  const left=BACK-Date.now(),dd=Math.ceil(left/864e5);
  $("sub").textContent=left>0?"Witamy w Polsce, mordo. Mission accomplished.":"Mission complete. See you next time, Daniel 🫡";
  $("st").innerHTML=left>0?"🇵🇱 STATUS: ON THE GROUND · powrót FR1835 06.12"+(dd>0?" · zostało "+dd+(dd===1?" dzień":" dni"):""):"🇬🇧 STATUS: BACK IN LONDON";
  $("st").classList.remove("air");
  $("snd").onclick=landing;confetti();
}
// animacja tytułu: dekodowanie liter jak w filmie szpiegowskim, potem co kilka sekund glitch
(()=>{const h=document.querySelector("h1"),F="D.A.N.I.E.L",G="#$%&@!?/<>*01XZ",B=[...document.querySelectorAll(".acr b")];
  let lock=0,f=0;
  const run=setInterval(()=>{f++;if(f%3===0&&lock<F.length){if(F[lock]!==".")flash(B[[...F.slice(0,lock)].filter(c=>c!==".").length]);lock++}
    h.textContent=[...F].map((c,i)=>i<lock||c==="."?c:G[Math.random()*G.length|0]).join("");
    if(lock>=F.length){clearInterval(run);h.textContent=F;glitch(500);setInterval(()=>glitch(220+Math.random()*250),5000+Math.random()*3000)}},45);
  function flash(b){if(!b)return;b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),900)}
  function glitch(ms){h.classList.add("gl");setTimeout(()=>h.classList.remove("gl"),ms)}
})();
// muzyka: YouTube; próba autostartu (desktop czasem pozwala), inaczej start przy pierwszym dotknięciu/kliknięciu gdziekolwiek
let yt,ytOn=false,ytReady=false,userPaused=false,want=false;
const play=()=>{if(!ytReady){want=true;return}yt.setVolume(70);yt.playVideo()};
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player("yt",{videoId:"yuKU-Vcwspk",
  playerVars:{loop:1,playlist:"yuKU-Vcwspk",controls:0,playsinline:1},
  events:{onReady:()=>{ytReady=true;play()},
    onStateChange:e=>{ytOn=e.data===1;$("mus").classList.toggle("on",ytOn);$("mt").textContent=ytOn?"PAUSE":"SOUNDTRACK";
      if(ytOn)$("mus").classList.remove("hint")}}})};
(()=>{const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.append(t)})();
$("mus").classList.add("hint");
$("mus").onclick=e=>{e.stopPropagation();if(ytOn){userPaused=true;yt.pauseVideo()}else{userPaused=false;play()}};
const first=e=>{if($("mus").contains(e.target))return;["pointerdown","keydown","touchend"].forEach(t=>removeEventListener(t,first,true));
  if(!ytOn&&!userPaused)play()};
["pointerdown","keydown","touchend"].forEach(t=>addEventListener(t,first,true));
// konfetti
function confetti(){
  const c=$("fx"),x=c.getContext("2d"),C=["#ff3b3b","#ffd23f","#fff","#DC143C","#012169","#0ff"];let P=[],t0=performance.now();
  const fit=()=>{c.width=innerWidth;c.height=innerHeight};fit();addEventListener("resize",fit);
  const burst=n=>{for(let i=0;i<n;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,
    vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*10,c:C[i%C.length]})};
  burst(260);setInterval(()=>burst(60),4000);
  (function f(){x.clearRect(0,0,c.width,c.height);P=P.filter(o=>o.y<c.height+30);
    for(const o of P){o.x+=o.vx+Math.sin((o.y+o.r*50)/60);o.y+=o.vy;o.r+=o.vr;x.save();x.translate(o.x,o.y);x.rotate(o.r);
      x.fillStyle=o.c;x.fillRect(-o.w/2,-o.h/4,o.w,o.h/2*Math.abs(Math.cos(o.r*2))+1);x.restore()}requestAnimationFrame(f)})();
}
// dźwięk lądowania (syntetyzowany, bez plików): przelot odrzutowca + gong lotniskowy
function landing(){
  const A=new (window.AudioContext||window.webkitAudioContext)(),now=A.currentTime;
  const len=A.sampleRate*3,b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=A.createBufferSource();n.buffer=b;const f=A.createBiquadFilter();f.type="bandpass";f.Q.value=.8;
  f.frequency.setValueAtTime(300,now);f.frequency.exponentialRampToValueAtTime(2500,now+1.2);f.frequency.exponentialRampToValueAtTime(200,now+3);
  const g=A.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.6,now+1.2);g.gain.exponentialRampToValueAtTime(.001,now+3);
  n.connect(f).connect(g).connect(A.destination);n.start(now);
  [[659.3,3.2],[523.3,3.7],[392,4.2]].forEach(([hz,t])=>{const o=A.createOscillator(),v=A.createGain();o.type="sine";o.frequency.value=hz;
    v.gain.setValueAtTime(0,now+t);v.gain.linearRampToValueAtTime(.35,now+t+.02);v.gain.exponentialRampToValueAtTime(.001,now+t+1.6);
    o.connect(v).connect(A.destination);o.start(now+t);o.stop(now+t+1.7)});
}
tick();
// gwiazdy
const c=$("s"),x=c.getContext("2d");let st=[];
function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:160},()=>({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*1.5+.3}))}
function dr(){x.clearRect(0,0,c.width,c.height);for(const s of st){s.x-=s.z*.4;if(s.x<0)s.x=c.width;
  x.fillStyle=`rgba(255,255,255,${s.z/2})`;x.fillRect(s.x,s.y,s.z,s.z)}requestAnimationFrame(dr)}
addEventListener("resize",rs);rs();dr();
</script>
</body>
</html>
