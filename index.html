<body>

<script>
const q=+new URLSearchParams(location.search).get("test");
// FR1834: Stansted 29.11 14:10 (UK) = 15:10 PL → Modlin 17:25 PL. Powrót FR1835: 06.12 12:15 PL. Test finału: ?test=10 (sekund).
const AFTER=new URLSearchParams(location.search).has("po");
const T=AFTER?Date.now()-1000:q?Date.now()+q*1000:Date.parse("2026-11-29T17:25:00+01:00"),
  OFF=q?T-30000:Date.parse("2026-11-29T15:10:00+01:00"),DAY=q?T-60000:Date.parse("2026-11-29T00:00:00+01:00"),
  BACK=Date.parse("2026-12-06T12:15:00+01:00");
const $=id=>document.getElementById(id),p=n=>String(n).padStart(2,"0");
const FR='<a href="https://www.flightradar24.com/data/flights/fr1834" target="_blank" rel="noopener">FlightRadar ↗</a>';
let stLast="";
function status(now){
  const t=now<DAY?"⏳ STATUS: WAITING · FR1834 · STN 14:10 → WMI 17:25"
    :now<OFF?"🛂 STATUS: CHECK-IN · BOARDING SOON · FR1834 STN 14:10"
    :"✈️ STATUS: IN THE AIR · FR1834 → MODLIN 17:25 · "+FR;
  if(t!==stLast){$("st").innerHTML=t;$("st").classList.toggle("air",now>=OFF);stLast=t}
}
function tick(){
  const now=Date.now(),r=T-now;
  $("pl").style.left=Math.min(100,Math.max(0,(now-OFF)/(T-OFF)*100))+"%";
  if(r<=0){finale();return}
  status(now);
  $("d").textContent=Math.floor(r/864e5);$("h").textContent=p(Math.floor(r/36e5)%24);
  $("m").textContent=p(Math.floor(r/6e4)%60);$("sec").textContent=p(Math.floor(r/1e3)%60);
  setTimeout(tick,1000-Date.now()%1000);
}
function finale(){
  // cyberpunk: glitch strony → digital rain + terminal → neonowy DANIEL + taśmy → wyłączenie jak CRT → ekran finału
  const o=document.createElement("div");o.id="cy";o.innerHTML='<canvas></canvas><div class="term cur"></div>';document.body.append(o);
  const N=["#ff2a6d","#05d9e8","#f9f002","#39ff14","#d1f7ff"],rnd=a=>a[Math.random()*a.length|0];
  document.body.classList.add("jit");setTimeout(()=>document.body.classList.remove("jit"),700);
  const bars=setInterval(()=>{o.querySelectorAll(".bar").forEach(b=>b.remove());for(let i=0;i<7;i++){const b=document.createElement("div");b.className="bar";
    b.style.cssText=`top:${Math.random()*100}%;height:${2+Math.random()*40}px;background:${rnd(N)};opacity:${.3+Math.random()*.6};transform:translateX(${(Math.random()-.5)*60}px)`;o.append(b)}},70);
  setTimeout(()=>{clearInterval(bars);o.querySelectorAll(".bar").forEach(b=>b.remove())},2600);
  try{cyber()}catch(e){}
  // digital rain
  const cv=o.querySelector("canvas"),cx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const fs=16,cols=Math.ceil(cv.width/fs),Y=Array(cols).fill(0).map(()=>Math.random()*-50),G="アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789DANIELＺ";
  const rain=setInterval(()=>{cx.fillStyle="rgba(2,2,8,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.font=fs+"px monospace";
    Y.forEach((y,i)=>{cx.fillStyle=Math.random()<.04?"#fff":(i%5?"#05d9e8":"#ff2a6d");cx.fillText(rnd(G),i*fs,y*fs);Y[i]=y*fs>cv.height&&Math.random()>.97?0:y+1})},40);
  // terminal
  const lines=['> INCOMING TRANSMISSION <span class="c">// FR1834 STN→WMI</span>','> TOUCHDOWN CONFIRMED <span class="c">[MODLIN]</span>',
    '> SCANNING PASSENGER .........','> IDENTITY: <span class="r">D.A.N.I.E.L</span> [MATCH 100%]','> THREAT LEVEL: <span class="r">██████████ NAJEBANY</span>','> ACCESS GRANTED_'];
  const term=o.querySelector(".term");let li=0;
  const type=()=>{if(li>=lines.length)return;const full=lines[li],plain=full.replace(/<[^>]+>/g,"");let k=0;const row=document.createElement("div");term.append(row);
    const t=setInterval(()=>{k+=2;row.textContent=plain.slice(0,k);if(k>=plain.length){clearInterval(t);row.innerHTML=full;li++;setTimeout(type,120)}},14)};
  setTimeout(type,500);
  // neon DANIEL
  setTimeout(()=>{term.remove();o.insertAdjacentHTML("beforeend",'<div class="neon"><div class="nw" data-t="DANIEL">DANIEL</div><div class="id">IDENTITY CONFIRMED // IN DA HOUSE</div></div>'+
    '<div class="tape t1"><span>'+"⚠ ARRIVAL DETECTED ⚠ FR1834 ⚠ MODLIN ⚠ ".repeat(8)+'</span></div><div class="tape t2"><span>'+"⚠ NAJEBANY IS EXPECTED LATER ⚠ ".repeat(8)+'</span></div>');
    requestAnimationFrame(()=>o.classList.add("tp"))},3100);
  // wyjście
  setTimeout(()=>{o.classList.add("off");settle();confetti(true)},6300);
  setTimeout(()=>{clearInterval(rain);o.remove()},6900);
}
function settle(){
  document.body.classList.add("done");document.title="🍻 DANIEL IS IN DA HOUSE";
  $("cd").innerHTML='<div><div class="win">🍻 DANIEL IS IN DA HOUSE 🍻</div><button id="snd">🔊 TOUCHDOWN</button></div>';
  const left=BACK-(AFTER?Date.parse("2026-11-29T18:00:00+01:00"):Date.now()),dd=Math.ceil(left/864e5);
  $("sub").textContent=left>0?"Witamy w Polsce, mordo. Mission accomplished.":"Mission complete. See you next time, Daniel 🫡";
  $("st").innerHTML=left>0?"🇵🇱 STATUS: ON THE GROUND · powrót FR1835 06.12"+(dd>0?" · zostało "+dd+(dd===1?" dzień":" dni"):""):"🇬🇧 STATUS: BACK IN LONDON";
  $("st").classList.remove("air");
  $("snd").onclick=landing;
  if(!$("rn")){
    document.body.insertAdjacentHTML("afterbegin",'<div class="ctape"><span>'+"⚠ DANIEL IS IN DA HOUSE ⚠ FR1834 LANDED ⚠ MODLIN ⚠ NAJEBANY IS EXPECTED LATER ".repeat(6)+'</span></div><canvas id="rn"></canvas>');
    const cv=$("rn"),cx=cv.getContext("2d"),fs=16,G="アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789DANIEL";let Y=[];
    const fit=()=>{cv.width=innerWidth;cv.height=innerHeight;Y=Array(Math.ceil(cv.width/fs)).fill(0).map(()=>Math.random()*-60)};fit();addEventListener("resize",fit);
    setInterval(()=>{cx.fillStyle="rgba(2,2,8,.1)";cx.fillRect(0,0,cv.width,cv.height);cx.font=fs+"px monospace";
      Y.forEach((y,i)=>{cx.fillStyle=Math.random()<.03?"#fff":(i%4?"#05d9e8":"#ff2a6d");cx.fillText(G[Math.random()*G.length|0],i*fs,y*fs);
        Y[i]=y*fs>cv.height&&Math.random()>.975?0:y+1})},55);

// animacja tytułu: dekodowanie liter jak w filmie szpiegowskim, potem co kilka sekund glitch
(()=>{const h=document.querySelector("h1"),F="D.A.N.I.E.L",G="#$%&@!?/<>*01XZ",B=[...document.querySelectorAll(".acr b")];
  let lock=0,f=0;
  const run=setInterval(()=>{f++;if(f%3===0&&lock<F.length){if(F[lock]!==".")flash(B[[...F.slice(0,lock)].filter(c=>c!==".").length]);lock++}
    h.textContent=[...F].map((c,i)=>i<lock||c==="."?c:G[Math.random()*G.length|0]).join("");
    if(lock>=F.length){clearInterval(run);h.textContent=F;glitch(500);setInterval(()=>glitch(220+Math.random()*250),5000+Math.random()*3000)}},45);
  function flash(b){if(!b)return;b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),900)}
  function glitch(ms){h.classList.add("gl");setTimeout(()=>h.classList.remove("gl"),ms)}
})();
// muzyka: YouTube. Autostart próbujemy, ale przeglądarki go blokują (albo puszczają wyciszony) – wtedy start przy pierwszym
// kliknięciu/dotknięciu gdziekolwiek. Na telefonie liczy się dopiero touchend/click (pointerdown nie odblokowuje dźwięku).
let yt,ytReady=false,userPaused=false;
const audible=()=>ytReady&&yt.getPlayerState()===1&&!yt.isMuted();
const play=()=>{if(!ytReady)return;yt.unMute();yt.setVolume(70);yt.playVideo()};
const ui=()=>{const on=audible();$("mus").classList.toggle("on",on);$("mus").classList.toggle("hint",!on&&!userPaused);$("mt").textContent=on?"PAUSE":"SOUNDTRACK";
  if(on)EV.forEach(t=>removeEventListener(t,first,true))};
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player("yt",{videoId:"yuKU-Vcwspk",width:200,height:200,
  playerVars:{loop:1,playlist:"yuKU-Vcwspk",controls:0,playsinline:1},
  events:{onReady:()=>{ytReady=true;play();setTimeout(ui,800)},onStateChange:()=>setTimeout(ui,50)}})};
(()=>{const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.append(t)})();
$("mus").classList.add("hint");
$("mus").onclick=e=>{e.stopPropagation();if(audible()){userPaused=true;yt.pauseVideo()}else{userPaused=false;play()}};
const EV=["click","touchend","keydown"];
function first(e){if($("mus").contains(e.target)||userPaused)return;if(!audible())play()}
EV.forEach(t=>addEventListener(t,first,true));
function confetti(boom){
  const c=$("fx"),x=c.getContext("2d"),C=["#ff2a6d","#05d9e8","#f9f002","#39ff14","#d1f7ff","#ffd23f"];let P=[];
  const fit=()=>{c.width=innerWidth;c.height=innerHeight};fit();addEventListener("resize",fit);
  const mk=(o,i)=>Object.assign({r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*10,c:C[i%C.length],g:0,dr:1},o);
  const rain=n=>{for(let i=0;i<n;i++)P.push(mk({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3},i))};
  const bang=n=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,v=8+Math.random()*16;
    P.push(mk({x:c.width/2,y:c.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.22,dr:.985},i))}};
  if(boom)bang(420);setTimeout(()=>rain(220),boom?600:0);setInterval(()=>rain(60),4000);
  (function f(){x.clearRect(0,0,c.width,c.height);P=P.filter(o=>o.y<c.height+40&&o.x>-60&&o.x<c.width+60);
    for(const o of P){o.vx*=o.dr;o.vy=o.vy*o.dr+o.g;o.x+=o.vx+(o.g?0:Math.sin((o.y+o.r*50)/60));o.y+=o.vy;o.r+=o.vr;
      x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.fillRect(-o.w/2,-o.h/4,o.w,o.h/2*Math.abs(Math.cos(o.r*2))+1);x.restore()}
    requestAnimationFrame(f)})();
}
// dźwięk lądowania (syntetyzowany, bez plików): przelot odrzutowca + gong lotniskowy
function cyber(){
  const A=new (window.AudioContext||window.webkitAudioContext)(),t0=A.currentTime;
  for(let i=0;i<22;i++){const o=A.createOscillator(),g=A.createGain(),t=t0+i*.06+Math.random()*.03;o.type="square";
    o.frequency.value=300+Math.random()*1800;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g).connect(A.destination);o.start(t);o.stop(t+.06)}
  const d=t0+3.1,o=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();o.type="sawtooth";
  o.frequency.setValueAtTime(160,d);o.frequency.exponentialRampToValueAtTime(35,d+1.6);f.type="lowpass";f.frequency.value=900;
  g.gain.setValueAtTime(0,d);g.gain.linearRampToValueAtTime(.5,d+.05);g.gain.exponentialRampToValueAtTime(.001,d+2.4);
  o.connect(f).connect(g).connect(A.destination);o.start(d);o.stop(d+2.5);
}
function landing(){
  const A=new (window.AudioContext||window.webkitAudioContext)(),now=A.currentTime;
  const len=A.sampleRate*3,b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=A.createBufferSource();n.buffer=b;const f=A.createBiquadFilter();f.type="bandpass";f.Q.value=.8;
  f.frequency.setValueAtTime(300,now);f.frequency.exponentialRampToValueAtTime(2500,now+1.2);f.frequency.exponentialRampToValueAtTime(200,now+3);
  const g=A.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.6,now+1.2);g.gain.exponentialRampToValueAtTime(.001,now+3);
  n.connect(f).connect(g).connect(A.destination);n.start(now);
  [[659.3,3.2],[523.3,3.7],[392,4.2]].forEach(([hz,t])=>{const o=A.createOscillator(),v=A.createGain();o.type="sine";o.frequency.value=hz;
    v.gain.setValueAtTime(0,now+t);v.gain.linearRampToValueAtTime(.35,now+t+.02);v.gain.exponentialRampToValueAtTime(.001,now+t+1.6);
    o.connect(v).connect(A.destination);o.start(now+t);o.stop(now+t+1.7)});
}
